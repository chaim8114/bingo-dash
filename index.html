<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>

<meta charset="utf-8">

<style>
*{box-sizing:border-box}body{margin:0;font-family:Rubik,Assistant,Segoe UI,Arial,sans-serif;background:#f3f5fb;color:#1f2540}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg button{border:1px solid #6a3df0;background:#fff;color:#6a3df0;padding:7px 14px;cursor:pointer;font-size:14px}
.seg button:first-child{border-radius:0 10px 10px 0}.seg button:last-child{border-radius:10px 0 0 10px}
.seg button.on{background:#6a3df0;color:#fff}
input,button.b{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid #ccd}
button.b{background:#6a3df0;color:#fff;border:0;cursor:pointer}button.b.sm{padding:5px 10px;font-size:13px}
button.b.g{background:#12b5a6}
h2{font-size:17px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid #eef;text-align:right}
th{color:#667;font-weight:500}.up{color:#12a150}.down{color:#d33}.muted{color:#999}
.chartbox{position:relative;height:320px}
.link{direction:ltr;font-size:12px;word-break:break-all;background:#f6f6fb;padding:8px;border-radius:8px;margin:8px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2540;color:#fff;padding:9px 18px;border-radius:20px;display:none}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:850px){.grid2{grid-template-columns:1fr 1fr}}
.gen{border:2px solid #12b5a6}.gen .link{font-size:13px}
button.b.r{background:#e74c3c}button.b.o{background:#fff;color:#6a3df0;border:1px solid #6a3df0}
.ptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}.ptools select,.ptools input{font:inherit;padding:7px 10px;border-radius:10px;border:1px solid #ccd}
.pwrap{max-height:520px;overflow:auto}.pwrap td.ph{direction:ltr;text-align:right;white-space:nowrap}
.tag{background:#efeafe;color:#6a3df0;border-radius:8px;padding:2px 8px;font-size:12px;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(20,25,50,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:380px;width:100%;margin:0}.modal .bar{justify-content:flex-start;margin-top:12px}
@media(max-width:600px){.hide-m{display:none}}
</style>
</head>
<body>
<header><h1 id="h1"></h1><p id="hsub"></p></header>
<main>
<div class="kpis" id="kpis"></div>
<div class="card gen"><h2>לינק כללי (בלי מקור)</h2><div class="muted" style="font-size:13px">מי שמגיע דרכו נרשם כמקור "כללי"</div><div class="link" id="genLink"></div><button class="b g" id="cpGen">העתק לינק כללי</button></div>
<div class="card bar">
 <div class="seg" id="seg"></div>
 <label id="lFrom"></label><input type="date" id="from">
 <label id="lTo"></label><input type="date" id="to">
 <button class="b sm" id="reset"></button>
</div>
<div class="card"><h2 id="tTrend"></h2><div class="chartbox"><canvas id="trend"></canvas></div></div>
<div class="grid2">
 <div class="card"><h2 id="tBy"></h2><div class="chartbox" style="height:260px"><canvas id="bars"></canvas></div><table id="byTbl"></table></div>
 <div class="card"><h2 id="tSrc"></h2><table id="srcTbl"></table></div>
</div>
<div class="card"><h2 id="tAdd"></h2>
 <div class="bar"><input id="newName" style="flex:1;min-width:180px"><button class="b" id="addBtn"></button></div>
 <div id="addRes"></div>
</div>
<div class="card" id="pCard"><h2>מי נכנס (<span id="pCount">0</span>)</h2>
 <div class="ptools"><select id="pSrc"></select><input id="pQ" placeholder="חיפוש שם או טלפון" style="flex:1;min-width:160px"></div>
 <div class="ptools"><button class="b sm o" id="selAll">סמן הכל</button><button class="b sm o" id="selNone">נקה סימון</button><span class="muted" id="selInfo"></span></div>
 <div class="ptools"><select id="exWhat"><option value="sel">המסומנים</option><option value="view">מה שמוצג (לפי סינון)</option><option value="all">כל אנשי הקשר</option></select><button class="b sm" id="exCsv">הורד אקסל (CSV)</button><button class="b sm g" id="exVcf">הורד לאנשי קשר (vCard)</button></div>
 <div class="pwrap"><table id="pTbl"></table></div></div>
</main>
<div class="modal" id="modal"><div class="card"><p id="mText"></p><div class="bar"><button class="b r" id="mYes">מחק</button><button class="b o" id="mNo">ביטול</button></div></div></div>
<div class="toast" id="toast"></div>
<script>

 total:'\u05e1\u05d4"\u05db \u05e0\u05e9\u05de\u05e8\u05d5', today:'\u05d4\u05d9\u05d5\u05dd', week:'\u05d4\u05e9\u05d1\u05d5\u05e2', month:'\u05d4\u05d7\u05d5\u05d3\u05e9', dups:'\u05db\u05d1\u05e8 \u05e9\u05de\u05d5\u05e8\u05d9\u05dd',

 sum:'\u05e1\u05d4"\u05db', loading:'\u05d8\u05d5\u05e2\u05df...', err:'\u05e9\u05d2\u05d9\u05d0\u05d4: ', newLink:'\u05d4\u05e7\u05d9\u05e9\u05d5\u05e8 \u05dc\u05de\u05e7\u05d5\u05e8 \u05d4\u05d7\u05d3\u05e9:', exists:'\u05d4\u05de\u05e7\u05d5\u05e8 \u05db\u05d1\u05e8 \u05e7\u05d9\u05d9\u05dd. \u05d4\u05e7\u05d9\u05e9\u05d5\u05e8 \u05e9\u05dc\u05d5:',

function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';'})}
['h1','hsub'].forEach(function(i){$(i).textContent=T[i]});
$('lFrom').textContent=T.from;$('lTo').textContent=T.to;$('reset').textContent=T.reset;
$('tTrend').textContent=T.trend;$('tBy').textContent=T.by;$('tSrc').textContent=T.src;$('tAdd').textContent=T.add;
$('addBtn').textContent=T.addBtn;$('newName').placeholder=T.ph;$('h1').textContent=T.h1;
var DATA=[],SOURCES=[],GRAN='day',trendChart,barChart;
var COLORS=['#6a3df0','#12b5a6','#f39c12','#e74c3c','#3498db','#9b59b6','#2ecc71','#e67e22','#1abc9c','#c0392b'];
var seg=$('seg');[['day',T.day],['week',T.wk],['month',T.mo]].forEach(function(g){var b=document.createElement('button');b.textContent=g[1];b.dataset.g=g[0];b.onclick=function(){GRAN=g[0];render()};seg.appendChild(b)});
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

function sow(d){var x=sod(d);x.setDate(x.getDate()-x.getDay());return x}

function bucketStart(d){return GRAN=='day'?sod(d):GRAN=='week'?sow(d):som(d)}
function nextB(d){var x=new Date(d);if(GRAN=='day')x.setDate(x.getDate()+1);else if(GRAN=='week')x.setDate(x.getDate()+7);else x.setMonth(x.getMonth()+1);return x}
function prevB(d){var x=new Date(d);if(GRAN=='day')x.setDate(x.getDate()-1);else if(GRAN=='week')x.setDate(x.getDate()-7);else x.setMonth(x.getMonth()-1);return x}
function label(d){return GRAN=='month'?pad(d.getMonth()+1)+'/'+d.getFullYear():pad(d.getDate())+'/'+pad(d.getMonth()+1)}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},1800)}
function copy(txt){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast(T.copied)},function(){var a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast(T.copied)})}
function saved(){return DATA.filter(function(r){return r.status=='saved'})}

function range(){var f=$('from').value,t=$('to').value;var a=f?new Date(f+'T00:00:00'):null,b=t?new Date(t+'T00:00:00'):null;if(b)b.setDate(b.getDate()+1);return [a,b]}
function kpis(){var s=saved(),now=new Date(),d=sod(now),w=sow(now),m=som(now),dupN=DATA.length-s.length;
 var c=function(a){return s.filter(function(r){return r.d>=a}).length};

 $('kpis').innerHTML=items.map(function(i,ix){return '<div class="card kpi"><div class="v"'+(ix==4?' style="color:#999"':'')+'>'+i[1]+'</div><div class="l">'+esc(i[0])+'</div></div>'}).join('')}
function render(){
 [].forEach.call(seg.children,function(b){b.classList.toggle('on',b.dataset.g==GRAN)});

 trendChart=new Chart($('trend'),{type:'line',data:{labels:buckets.map(label),datasets:ds},options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{y:{beginAtZero:true,ticks:{precision:0}}},plugins:{legend:{position:'bottom'}}}});
 // current period vs previous period of same length

function renderSources(){var cnt={};saved().forEach(function(r){cnt[r.source]=(cnt[r.source]||0)+1});

var PEOPLE=[],SEL={};

function exList(){var w=$('exWhat').value;var l=w=='all'?PEOPLE:w=='view'?pView():PEOPLE.filter(function(p){return SEL[pKey(p)]});
 var seen={};return l.filter(function(p){var d=p.phone.replace(/[^0-9]/g,'');if(seen[d])return false;seen[d]=1;return true})}
function dl(name,txt,type){var b=new Blob([txt],{type:type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}
function csvCell(x){x=String(x==null?'':x);if(/^[=@]|^[+\-](?![0-9])/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'}
function csvPhone(p){var d=String(p).replace(/[^0-9]/g,'');return /^972\d{8,9}$/.test(d)?'+972 '+d.slice(3,5)+'-'+d.slice(5,8)+'-'+d.slice(8):p}
function toCsv(l){return '\ufeff'+[['שם','טלפון','מקור','תאריך']].concat(l.map(function(p){return [p.name,csvPhone(p.phone),p.source,pDate(p.t)]})).map(function(r){return r.map(csvCell).join(',')}).join('\r\n')}
function vEsc(x){return String(x||'').replace(/[\\;,]/g,function(c){return '\\'+c}).replace(/\r?\n/g,' ')}
function toVcf(l){return l.map(function(p){var n=(p.name||p.phone)+' ('+p.source+')';return ['BEGIN:VCARD','VERSION:3.0','FN:'+vEsc(n),'N:;'+vEsc(n)+';;;','TEL;TYPE=CELL:'+p.phone.replace(/[^0-9+]/g,''),'NOTE:'+vEsc('בינגו Fit | '+p.source+' | '+pDate(p.t)),'END:VCARD'].join('\r\n')}).join('\r\n')+'\r\n'}
function exGo(kind){var l=exList();if(!l.length){toast('אין אנשי קשר לייצוא');return}var nm='bingo-contacts-'+ymd(new Date());
 if(kind=='csv')dl(nm+'.csv',toCsv(l),'text/csv;charset=utf-8');else dl(nm+'.vcf',toVcf(l),'text/vcard;charset=utf-8')}
$('pSrc').onchange=$('pQ').oninput=renderPeople;
$('selAll').onclick=function(){pView().forEach(function(p){SEL[pKey(p)]=1});renderPeople()};
$('selNone').onclick=function(){SEL={};renderPeople()};
$('exCsv').onclick=function(){exGo('csv')};$('exVcf').onclick=function(){exGo('vcf')};
var GEN='https://wa.me/972559885270?text='+encodeURIComponent('אני רוצה להצטרף לסטטוס של חיים קורנברג');
$('genLink').textContent=GEN;$('cpGen').onclick=function(){copy(GEN)};
function load(){
 call({api:'all'},function(d){DATA=d.stats.map(function(r){return {d:new Date(r.t),source:r.source,status:r.status}});SOURCES=d.sources;render()},fail);
 call({api:'people'},function(p){PEOPLE=p;renderPeople()},function(e){$('pTbl').innerHTML='<tr><td class="muted">רשימת האנשים תהיה זמינה בקרוב ('+esc(e&&e.message||e)+')</td></tr>'})}
function fail(e){toast(T.err+(e&&e.message||e))}
$('from').onchange=$('to').onchange=render;
$('reset').onclick=function(){$('from').value='';$('to').value='';render()};
$('addBtn').onclick=function(){var n=$('newName').value.trim();if(!n)return;$('addBtn').disabled=true;
 call({api:'add',name:n},function(r){$('addBtn').disabled=false;$('newName').value='';
  $('addRes').innerHTML='<p>'+(r.existed?T.exists:T.newLink)+' <b>'+esc(r.name)+'</b></p><div class="link">'+esc(r.link)+'</div><button class="b g" id="cpNew">'+T.copy+'</button>';
  $('cpNew').onclick=function(){copy(r.link)};
  call({api:'sources'},function(s){SOURCES=s;renderSources()},fail);
 },function(e){$('addBtn').disabled=false;fail(e)})};
// default: last 30 days
(function(){var t=new Date(),f=new Date();f.setDate(f.getDate()-29);$('from').value=ymd(f);$('to').value=ymd(t)})();
if(!K){toast(T.err+'missing key');}else load();
setInterval(function(){if(K)load()},300000);
</script>
